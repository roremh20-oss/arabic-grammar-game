<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="لعبة تعليمية تفاعلية لتعلم قواعد اللغة العربية" />
  <meta name="theme-color" content="#1565c0" />
  <title>أسطورة بطل الأفعال - لعبة تعليمية</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "Tahoma", "Arial", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      background: linear-gradient(135deg, #83a4d4, #b6fbff);
      transition: background 0.5s ease;
    }
    .world-ice { background: linear-gradient(135deg, #83a4d4, #b6fbff); }
    .world-volcano { background: linear-gradient(135deg, #485563, #29323c); }
    .world-castle { background: linear-gradient(135deg, #134e5e, #71b280); }

    #game-card {
      width: min(100%, 500px);
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #world-title {
      margin: 0;
      color: #1565c0;
      font-size: 22px;
    }

    h2 {
      margin: 8px 0 14px;
      color: #0d47a1;
      font-size: 28px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #1565c0, #1e88e5);
      color: white;
      border-radius: 18px;
      padding: 10px 16px;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 14px;
    }

    #maze {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: rgba(0,0,0,0.12);
      padding: 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: white;
      user-select: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .cell-wall { background: #37474f; }
    .cell-gate { background: #ffb300; box-shadow: 0 0 12px rgba(255,179,0,0.5); }
    .cell-target { background: #00e676; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 240px;
      margin: 12px auto;
    }

    .btn-ctrl {
      background: linear-gradient(135deg, #ff4081, #f50057);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255,64,129,0.3);
    }

    .btn-ctrl:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255,64,129,0.4);
    }

    .btn-ctrl:active {
      transform: scale(0.92);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: white;
      width: min(100%, 380px);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideIn 0.3s ease;
    }

    .modal h2 { margin: 0 0 12px; color: #0d47a1; }
    .modal p { margin: 8px 0; color: #424242; }

    .opt-btn {
      display: block;
      width: 100%;
      padding: 12px 14px;
      margin: 8px 0;
      background: linear-gradient(135deg, #1e88e5, #1565c0);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .opt-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30,136,229,0.3);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #1565c0;
      text-align: center;
      font-size: 16px;
      margin-bottom: 12px;
      font-family: "Tahoma", sans-serif;
    }

    #send-status {
      min-height: 24px;
      color: #2e7d32;
      font-weight: bold;
      margin-top: 8px;
    }

    .controls-bottom {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn-secondary {
      background: #3949ab;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: #303f9f;
      transform: translateY(-2px);
    }

    .info-badge {
      background: rgba(21,101,192,0.1);
      border-right: 4px solid #1565c0;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 14px;
      color: #1565c0;
    }
  </style>
</head>
<body class="world-ice">
  <div id="game-card">
    <h3 id="world-title">❄️ الفصل 1: مملكة الجليد</h3>
    <h2>🛡️ أسطورة بطل الأفعال 🛡️</h2>

    <div class="status-bar">
      <div>📍 مرحلة: <span id="level-num">1</span>/3</div>
      <div id="hearts-display">❤️❤️❤️</div>
      <div>⭐ النقاط: <span id="score">0</span></div>
    </div>

    <div id="maze"></div>

    <div class="controls">
      <div></div>
      <button class="btn-ctrl" onclick="move(0, -1)" title="الأعلى">⬆️</button>
      <div></div>
      <button class="btn-ctrl" onclick="move(-1, 0)" title="اليسار">⬅️</button>
      <button class="btn-ctrl" onclick="move(0, 1)" title="الأسفل">⬇️</button>
      <button class="btn-ctrl" onclick="move(1, 0)" title="اليمين">➡️</button>
    </div>

    <div class="controls-bottom">
      <button class="btn-secondary" onclick="toggleMusic()" id="audio-toggle">🔊 موسيقى</button>
      <button class="btn-secondary" onclick="resetGame()">🔄 إعادة تشغيل</button>
    </div>

    <div class="info-badge">
      💡 توجه نحو 🏁 | اختبر نفسك عند 🗝️ لفتح الباب
    </div>
  </div>

  <div id="question-modal" class="modal">
    <div class="modal-content">
      <h4 id="q-type-badge" style="color:#1565c0; margin:0; margin-bottom:12px;">تحدي القواعد</h4>
      <p id="question-text" style="font-size:18px; font-weight:bold; margin:12px 0;"></p>
      <div id="options-container"></div>
    </div>
  </div>

  <div id="win-modal" class="modal">
    <div class="modal-content">
      <h2>👑 مبروك يا بطل القلعة! 👑</h2>
      <p>✨ أكملت اللعبة بنجاح! ✨</p>
      <p>النقاط النهائية: <strong id="final-score" style="color:#2e7d32; font-size:18px;">0</strong></p>
      <input type="text" id="student-name" placeholder="اسم التلميذ الثلاثي" />
      <button class="opt-btn" style="background:linear-gradient(135deg, #2e7d32, #1b5e20);" onclick="sendResults()">إرسال النتيجة 📤</button>
      <div id="send-status"></div>
    </div>
  </div>

  <audio id="bg-music">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/mgaokdyk";

    const worlds = [
      { name: "❄️ الفصل 1: مملكة الجليد", bg: "world-ice", wallEmoji: "🧊", gateEmoji: "🗝️", player: "🐧" },
      { name: "🔥 الفصل 2: أرض البركان", bg: "world-volcano", wallEmoji: "🌋", gateEmoji: "💎", player: "🏃‍♂️" },
      { name: "🏰 الفصل 3: قلعة الأفعال", bg: "world-castle", wallEmoji: "🌲", gateEmoji: "🚪", player: "🛡️" }
    ];

    let levels = [
      { grid: [[0,0,1,0,3],[1,2,1,0,1],[0,0,0,2,0],[0,1,1,1,0],[0,0,2,0,0]], start:[4,0] },
      { grid: [[0,2,0,1,3],[0,1,0,2,0],[0,2,1,1,0],[1,0,0,2,0],[0,0,1,0,0]], start:[4,0] },
      { grid: [[0,1,3,1,0],[2,1,2,1,2],[0,0,0,0,0],[1,2,1,2,1],[0,0,0,0,0]], start:[4,0] }
    ];

    const questions = [
      { type: "تحديد الحركة", q: "ما حركة آخر الفعل الماضي (دَرَسَ)؟", opts: ["الفتحة (ـَ)", "الضمة (ـُ)", "الكسرة (ـِ)"], a: 0 },
      { type: "تحويل الفعل", q: "حوّل الفعل الماضي (كَتَبَ) إلى مضارع:", opts: ["يَكْتُبُ", "أُكْتُبْ", "كِتَابَةٌ"], a: 0 },
      { type: "إكمال الجملة", q: "أكمل بالفعل المناسب: .... الطفلُ الحليبَ الآن.", opts: ["شَرِبَ", "يَشْرَبُ", "إِشْرَبْ"], a: 1 },
      { type: "تحديد الزمن", q: "الفعل (رَسَمَ) يشير إلى حدث:", opts: ["حدث وانتهى (ماضٍ)", "يحدث الآن (مضارع)"], a: 0 },
      { type: "تصريف الفعل", q: "صرّف الفعل (ذَهَبَ) مع 'هو':", opts: ["ذَهَبَ", "تَذْهَبُ", "يَذْهَبُ"], a: 2 },
      { type: "تحديد نوع الفعل", q: "الفعل (يَلْعَبُ) هو:", opts: ["ماضي", "مضارع", "أمر"], a: 1 }
    ];

    let currentLevel = 0;
    let score = 0;
    let playerPos = [4,0];
    let currentGate = null;
    let qIndex = 0;
    let lives = 3;
    let musicOn = false;

    const bgMusic = document.getElementById("bg-music");

    function initLevel() {
      playerPos = [...levels[currentLevel].start];
      document.getElementById("level-num").innerText = currentLevel + 1;
      document.getElementById("world-title").innerText = worlds[currentLevel].name;
      document.body.className = worlds[currentLevel].bg;
      updateHearts();
      renderMaze();
    }

    function renderMaze() {
      const mazeEl = document.getElementById("maze");
      mazeEl.innerHTML = "";
      const grid = levels[currentLevel].grid;
      const world = worlds[currentLevel];

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";

          if (r === playerPos[0] && c === playerPos[1]) {
            cell.innerText = world.player;
          } else if (grid[r][c] === 1) {
            cell.classList.add("cell-wall");
            cell.innerText = world.wallEmoji;
          } else if (grid[r][c] === 2) {
            cell.classList.add("cell-gate");
            cell.innerText = world.gateEmoji;
          } else if (grid[r][c] === 3) {
            cell.classList.add("cell-target");
            cell.innerText = "🏁";
          }

          mazeEl.appendChild(cell);
        }
      }
    }

    function move(dr, dc) {
      const newR = playerPos[0] + dr;
      const newC = playerPos[1] + dc;

      if (newR < 0 || newR >= 5 || newC < 0 || newC >= 5) return;

      const cellType = levels[currentLevel].grid[newR][newC];
      if (cellType === 1) return;

      if (cellType === 2) {
        currentGate = [newR, newC];
        showQuestion();
        return;
      }

      if (cellType === 3) {
        playerPos = [newR, newC];
        renderMaze();

        if (currentLevel < levels.length - 1) {
          setTimeout(() => {
            alert("🎉 ممتاز! انتقلت إلى العالم التالي!");
            currentLevel++;
            initLevel();
          }, 300);
        } else {
          document.getElementById("final-score").innerText = score;
          document.getElementById("win-modal").style.display = "flex";
        }
        return;
      }

      playerPos = [newR, newC];
      renderMaze();
    }

    function showQuestion() {
      const q = questions[qIndex % questions.length];
      document.getElementById("q-type-badge").innerText = q.type;
      document.getElementById("question-text").innerText = q.q;

      const optsContainer = document.getElementById("options-container");
      optsContainer.innerHTML = "";

      q.opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, q.a);
        optsContainer.appendChild(btn);
      });

      document.getElementById("question-modal").style.display = "flex";
    }

    function checkAnswer(selected, correct) {
      document.getElementById("question-modal").style.display = "none";

      if (selected === correct) {
        score += 15;
        document.getElementById("score").innerText = score;

        if (currentGate) {
          levels[currentLevel].grid[currentGate[0]][currentGate[1]] = 0;
          playerPos = [currentGate[0], currentGate[1]];
          currentGate = null;
        }

        qIndex++;
        renderMaze();
      } else {
        lives--;
        updateHearts();

        if (lives <= 0) {
          alert("💥 انتهت الأرواح! اللعبة انتهت.");
          resetGame();
          return;
        }

        alert("❌ إجابة خاطئة! حاول مجدداً.");
      }
    }

    function updateHearts() {
      let hearts = "";
      for (let i = 0; i < lives; i++) hearts += "❤️";
      document.getElementById("hearts-display").innerText = hearts || "💔";
    }

    function resetGame() {
      currentLevel = 0;
      score = 0;
      qIndex = 0;
      lives = 3;
      document.getElementById("score").innerText = score;
      document.getElementById("win-modal").style.display = "none";
      document.getElementById("question-modal").style.display = "none";
      levels = [
        { grid: [[0,0,1,0,3],[1,2,1,0,1],[0,0,0,2,0],[0,1,1,1,0],[0,0,2,0,0]], start:[4,0] },
        { grid: [[0,2,0,1,3],[0,1,0,2,0],[0,2,1,1,0],[1,0,0,2,0],[0,0,1,0,0]], start:[4,0] },
        { grid: [[0,1,3,1,0],[2,1,2,1,2],[0,0,0,0,0],[1,2,1,2,1],[0,0,0,0,0]], start:[4,0] }
      ];
      initLevel();
    }

    function toggleMusic() {
      const button = document.getElementById("audio-toggle");
      if (musicOn) {
        bgMusic.pause();
        musicOn = false;
        button.textContent = "🔊 موسيقى";
      } else {
        bgMusic.play().catch(() => {});
        musicOn = true;
        button.textContent = "🔇 إيقاف";
      }
    }

    function sendResults() {
      const name = document.getElementById("student-name").value.trim();

      if (!name) {
        document.getElementById("send-status").innerText = "يرجى إدخال الاسم أولاً.";
        return;
      }

      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          "اسم التلميذ": name,
          "النقاط": score,
          "المستوى": currentLevel + 1,
          "التاريخ": new Date().toLocaleString('ar-SA')
        })
      })
      .then(() => {
        document.getElementById("send-status").innerText = "✅ تم الإرسال بنجاح! 🚀";
      })
      .catch(() => {
        document.getElementById("send-status").innerText = "⚠️ حدثت مشكلة في الإرسال.";
      });
    }

    initLevel();
  </script>
</body>
</html>
